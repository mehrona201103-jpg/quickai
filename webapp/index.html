ul{padding-left:18px;color:var(--mut);line-height:1.7;margin-top:10px}

.an{text-align:center}

.trow{display:flex;align-items:center;gap:10px}.tag{padding:6px 10px;border-radius:10px;font-weight:700}

.lim{text-align:center;color:var(--mut);font-size:12px;margin-top:8px}

#lock b{display:block;color:var(--tx);font:800 20px Unbounded;margin-bottom:10px}

      ctx.fillRect(x-w*.32,Math.min(y(c.o),y(c.c)),w*.64,Math.max(2,Math.abs(y(c.o)-y(c.c))))});
    if(dcA){ctx.beginPath();dcA.forEach((q,i)=>{const x=i*w+w/2;i?ctx.lineTo(x,y(q.hi)):ctx.moveTo(x,y(q.hi))});for(let i=dcA.length-1;i>=0;i--)ctx.lineTo(i*w+w/2,y(dcA[i].lo));ctx.closePath();ctx.fillStyle='rgba(123,136,173,.09)';ctx.fill();
      ctx.strokeStyle='rgba(160,172,210,.55)';ctx.lineWidth=1;['hi','lo'].forEach(k=>{ctx.beginPath();dcA.forEach((q,i)=>{const x=i*w+w/2;i?ctx.lineTo(x,y(q[k])):ctx.moveTo(x,y(q[k]))});ctx.stroke()})}
    if(stA){ctx.lineWidth=2;for(let i=1;i<stA.length;i++){if(stA[i].up!==stA[i-1].up)continue;ctx.strokeStyle=stA[i].up?'#19E3A0':'#FF4D6A';ctx.beginPath();ctx.moveTo((i-1)*w+w/2,y(stA[i-1].v));ctx.lineTo(i*w+w/2,y(stA[i].v));ctx.stroke()}}
    (IND.ema?[[e9,'#6C7BFF'],[e21,'#FFB84D']]:[]).forEach(([arr,col])=>{ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();arr.forEach((v,i)=>{const x=i*w+w/2;i?ctx.lineTo(x,y(v)):ctx.moveTo(x,y(v))});ctx.stroke()});
    const lh=ha[ha.length-1],up=lh.c>=lh.o,col=up?'#19E3A0':'#FF4D6A',ly=y(raw.c),pulse=(Math.sin((now-t0)/260)+1)/2;
    ctx.setLineDash([4,4]);ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(W-48,ly);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=col;ctx.fillRect(W-50,ly-9,50,18);ctx.fillStyle='#04120c';ctx.font='700 10px Manrope';ctx.textAlign='center';ctx.fillText((raw.c+OFF).toFixed(dec()),W-25,ly+3.5);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc((ha.length-1)*w+w/2,y(lh.c),2.5+pulse*3,0,7);ctx.fill();
    const pe=$('pr');pe.textContent=(raw.c+OFF).toFixed(dec());pe.style.color=lastPrice&&raw.c!==lastPrice?(raw.c>lastPrice?'#19E3A0':'#FF4D6A'):'';lastPrice=raw.c;
    if(marker){const my=y(marker.price);ctx.strokeStyle=marker.dir==='CALL'?'#19E3A0':'#FF4D6A';ctx.lineWidth=1.5;ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(0,my);ctx.lineTo(W-48,my);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=ctx.strokeStyle;ctx.font='700 11px Manrope';ctx.textAlign='left';ctx.fillText(marker.dir==='CALL'?'▲ CALL':'▼ PUT',8,my-6)}
    if(scanT>=0){const x=scanT*W,g=ctx.createLinearGradient(x-70,0,x,0);g.addColorStop(0,'rgba(108,123,255,0)');g.addColorStop(1,'rgba(108,123,255,.35)');
      ctx.fillStyle=g;ctx.fillRect(x-70,0,70,H);ctx.strokeStyle='#8ea0ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  }
  requestAnimationFrame(frame)
}

// ── сделка ──
function renderTrade(){
  const b=$('trade');if(!trade)return;
  const left=Math.max(0,trade.end-Date.now()),sec=Math.ceil(left/1000),mm=String(Math.floor(sec/60)).padStart(2,'0'),ss=String(sec%60).padStart(2,'0'),dur=(trade.dur||TFSEC[trade.tf])*1000;
  b.style.display='block';
  b.innerHTML=`<div class="h">${t('trade_t')}</div><div class="trow"><span class="tag ${trade.dir}">${trade.dir==='CALL'?'▲ CALL':'▼ PUT'}</span><span>${trade.pair}</span><div class="cd">${mm}:${ss}</div></div>
  <div class="pbar"><div style="width:${Math.min(100,100-left/dur*100)}%"></div></div><small class="m">${t('entry_price',{p:trade.entry.toFixed(decFor(trade.pair)),tf:fmtExp(trade.dur||TFSEC[trade.tf])})}</small>`}
async function settle(){
  if(settling||!trade)return;settling=true;const tr=trade;
  try{
    const r=await api('/api/settle',{id:tr.id});trade=null;
    const cls={W:'win',L:'lose'}[r.res]||'draw';
    $('trade').innerHTML=`<div class="h">${t('res_t')}</div><div class="res ${cls}">${t('res_'+r.res)}</div><small class="m">${t('res_note',{pair:tr.pair,a:tr.entry.toFixed(decFor(tr.pair)),b:r.exit?r.exit.toFixed(decFor(tr.pair)):'—'})}</small>`;
    tg?.HapticFeedback?.notificationOccurred(r.res==='W'?'success':r.res==='L'?'error':'warning');
    beep(r.res==='W'?[660,880,1100]:r.res==='L'?[330,262]:[440]);
    setTimeout(()=>{if(!trade)$('trade').style.display='none'},9000);loadMe();
  }catch(e){tr.end=Date.now()+(e.status===425?3000:8000)}
  settling=false}
setInterval(()=>{if(!trade)return;Date.now()>=trade.end?settle():renderTrade()},1000);

function renderMe(){
  if(!me)return;const s=me.stats,w=s.wins,l=s.losses;
  $('stats').innerHTML=s.total?`<div class="grid3"><div><small>${t('st_total')}</small><b>${s.total}</b></div><div><small>${t('st_w')}</small><b class="W">${w}</b></div><div><small>${t('st_l')}</small><b class="L">${l}</b></div></div><small class="m">${t('st_pct',{p:Math.round(w/Math.max(w+l,1)*100)})}</small>`:`<small class="m">${t('st_empty')}</small>`;
  $('hist').innerHTML=me.history.map(x=>`<div class="hi"><span>${x.dir==='CALL'?'▲':'▼'} ${x.pair} · ${fmtExp(x.dur||TFSEC[x.tf])}</span><span class="${x.result}">${t('h_'+x.result)}</span></div>`).join('');
  const st=$('streak');if(me.streak>=3){st.style.display='block';st.textContent=t('streak',{n:me.streak})}else st.style.display='none'}
async function loadMe(){
  try{me=await api('/api/me');plan=me.plan;updLim();if(me.pairs&&me.pairs.join()!==PAIRS.join()){PAIRS=me.pairs;draw();renderWiz()}
    if(me.active&&!trade){trade=me.active;renderTrade()}
    if(!LS.get('qa_lang',null)&&me.lang&&me.lang!==lang){lang=me.lang;applyLang()}
    renderMe();
  }catch(e){}}

// ── калькулятор ──
let risk=LS.get('qa_risk',2);
function renderRisk(){
  $('rk').innerHTML='';[1,2,5].forEach(r=>{const d=document.createElement('div');d.className='chip'+(r===risk?' on':'');d.textContent=r+'%';d.onclick=()=>{risk=r;LS.set('qa_risk',r);renderRisk()};$('rk').append(d)});
  const dep=parseFloat($('dep').value);
  $('rkout').innerHTML=dep>0?t('risk_out',{a:'<b style="color:var(--tx)">$'+(dep*risk/100).toFixed(2)+'</b>',r:risk}):t('risk_hint')}
$('dep').value=LS.get('qa_dep','');$('dep').oninput=()=>{LS.set('qa_dep',$('dep').value);renderRisk()};

// ── пошаговый мастер: пара → время → анализ → результат ──
const WZ=['pair','time','an','res'];let lastRes=null,wstep='pair';
function wz(n){wstep=n;WZ.forEach(k=>$('w-'+k).classList.toggle('on',k===n))}
function view(n){['sig','chart','prof'].forEach(k=>{$('v-'+k).classList.toggle('on',k===n);document.querySelector('[data-tab='+k+']').classList.toggle('on',k===n)})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>view(b.dataset.tab));
function renderWiz(){
  $('pg').innerHTML=PAIRS.map(p=>`<div class="pc${p===pair?' on':''}" data-p="${p}">${p}<small>${p.endsWith(' OTC')?'cat_otc':/^(BTC|ETH)\//.test(p)?'cat_cr':'cat_fx'}</small></div>`).join('');
  $('pg').querySelectorAll('.pc').forEach(e=>e.onclick=()=>{if(analyzing)return;pair=e.dataset.p;marker=null;draw();calNote();setSrc('sim');binConnect();loadChart();renderWiz();wz('time')});
  renderTime();
  $('wt-h').textContent=pair+' · '+t('pick_time');
  if(wstep==='res'&&lastRes)showRes(lastRes,true)}
$('b-time').onclick=()=>wz('pair');

let exp=LS.get('qa_exp',60);
const fmtExp=v=>[Math.floor(v/3600)?Math.floor(v/3600)+' '+t('u_h'):'',Math.floor(v%3600/60)?Math.floor(v%3600/60)+' '+t('u_m'):'',v%60?v%60+' '+t('u_s'):''].filter(Boolean).join(' ')||'0';
const PRESETS=[['M1',60],['M3',180],['M5',300],['M15',900],['M30',1800],['H1',3600],['H4',14400]],pad2=n=>String(n).padStart(2,'0');
function setExp(v){exp=Math.max(60,Math.min(14400,v));LS.set('qa_exp',exp);const nt=exp<=180?'1min':exp<=600?'5min':'15min';if(nt!==tf){tf=nt;marker=null;draw();setTl();loadChart()}renderTime()}
function renderTime(){
  $('tp-h').textContent=pad2(Math.floor(exp/3600));$('tp-m').textContent=pad2(Math.floor(exp%3600/60));$('tp-s').textContent=pad2(exp%60);
  $('presets').innerHTML=PRESETS.map(([l,v])=>`<div class="chip${v===exp?' on':''}" data-v="${v}">${l}</div>`).join('');
  $('presets').querySelectorAll('.chip').forEach(e=>e.onclick=()=>{if(!analyzing)setExp(+e.dataset.v)})}
document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{if(!analyzing)setExp(exp+ +b.dataset.st)});
$('t-go').onclick=runAnalysis;

// ── профиль ──
function inviteFriend(){if(!me||!me.bot)return;const link=`https://t.me/${me.bot}?start=ref_${me.uid}`,u=`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(t('share_txt'))}`;tg?.openTelegramLink?tg.openTelegramLink(u):window.open(u,'_blank')}
function payGo(k){if(!me||!me.bot)return;const u=`https://t.me/${me.bot}?start=pay_${k}`;tg?.openTelegramLink?tg.openTelegramLink(u):window.open(u,'_blank')}
function openPay(){payOpen=true;renderProfile();const e=$('paybox');if(e&&e.scrollIntoView)e.scrollIntoView({behavior:'smooth',block:'center'})}
const RANKS=[0,5,20,50,100,250];
function renderProfile(){
  if(!me)return;const p=plan,o=me.offer||{},pf=me.profile||{},tot=(me.stats&&me.stats.total)||0;
  const until=p.until?new Date(p.until).toLocaleDateString(lang==='en'?'en-GB':'ru-RU'):'';
  $('plan').innerHTML=`<div class="h">${p.pro?'👑 '+t('pro_active'):t('plan_free')}</div>
    <div class="prow">${p.pro?`<span class="badge pro">PRO</span><span>${until?t('pro_until',{d:until}):t('pro_forever')}</span>`:`<span class="badge">FREE</span><span>${t('credits_left',{n:p.credits})}</span>`}</div>
    <div class="two"><button class="sbtn" id="p-inv">${t('invite_btn')} (+${o.ref||2})</button><button class="wbtn" style="margin:0" id="p-buy">${t('buy_pro')}</button></div>
    <div id="paybox" style="display:${payOpen?'block':'none'}"><div class="offer">${t('offer',{days:o.days||30,stars:o.stars||250,usdt:o.usdt||5})}</div>
    <div class="two"><button class="sbtn" id="p-stars">${t('pay_stars')}</button>${me.crypto?`<button class="sbtn" id="p-crypto">${t('pay_crypto')}</button>`:''}</div></div>`;
  $('p-inv').onclick=inviteFriend;$('p-buy').onclick=()=>{payOpen=!payOpen;renderProfile()};$('p-stars').onclick=()=>payGo('stars');
  const pc=$('p-crypto');if(pc)pc.onclick=()=>payGo('crypto');
  let ri=0;RANKS.forEach((v,i)=>{if(tot>=v)ri=i});const nx=RANKS[ri+1],bp=pf.best_pair;
  $('rank').innerHTML=`<div class="h">${t('rank_t')}: ${t('r'+ri)}</div><div class="bar"><div style="width:${nx?Math.min(100,(tot-RANKS[ri])/(nx-RANKS[ri])*100):100}%"></div></div>
    <small class="m">${nx?t('to_next',{n:t('r'+(ri+1)),k:nx-tot}):t('rank_max')}</small>
    <div class="dots">${(pf.last10||[]).map(r=>`<span class="dot ${r}"></span>`).join('')}</div><small class="m">${t('last10')}</small>
    <div class="tiles"><div><small>${t('best_pair')}</small><b>${bp?bp.pair+' · '+bp.wr+'%':'—'}</b></div><div><small>${t('best_streak')}</small><b>${pf.best_streak||0}</b></div></div>`;
  const A=[['a1',tot>=1,'🎯'],['a2',tot>=10,'🔟'],['a3',(pf.best_streak||0)>=3,'🔥'],['a4',tot>=50,'🏅'],['a5',((me.refs&&me.refs.n)||0)>=1,'🤝'],['a6',p.pro,'👑']];
  $('ach').innerHTML=`<div class="h">${t('ach_t')}</div><div class="ach">${A.map(([k,on,ic])=>`<div class="ab${on?' on':''}"><span>${on?ic:'🔒'}</span>${t(k)}</div>`).join('')}</div>`}

async function runAnalysis(){
  if(analyzing)return;
  if(trade){showRes({error:t('err_busy'),soft:1});return}
  if(!plan.pro&&plan.credits<=0){showRes({error:t('err_nocredits',{n:me?.offer?.ref||2}),code:'nocredits',soft:1});return}
  analyzing=true;marker=null;wz('an');beep([520]);tg?.HapticFeedback?.impactOccurred('medium');
  const STEPS=['s1','s2','s3','s4','s5','s6'].map(k=>t(k));$('an-pair').textContent=pair+' · '+fmtExp(exp);
  const reqP=api('/api/analyze',{pair,exp,lang}).catch(e=>({error:errText(e),code:e.code}));
  const DUR=4600,start=performance.now();let si=-1;
  await new Promise(res=>{(function tick(){const p=Math.min((performance.now()-start)/DUR,1);
    $('an-pct').textContent=Math.round(p*100)+'%';$('an-t').textContent=t(p<.5?'an1':'an2');$('an-fill').style.width=p*100+'%';
    const i=Math.min(Math.floor(p*STEPS.length),STEPS.length-1);if(i!==si){si=i;$('an-s').textContent=STEPS[i];tg?.HapticFeedback?.selectionChanged?.()}
    p<1?requestAnimationFrame(tick):res()})()});
  const d=await reqP;analyzing=false;lastRes=d;showRes(d)}

function showRes(d,re){
  wz('res');const box=$('rc');
  const nav=`<button class="wbtn" id="r-again">⟳ ${t('again')}</button><div class="two"><button class="sbtn" id="r-time">${t('chg_time')}</button><button class="sbtn" id="r-pair">${t('chg_pair')}</button></div>`;
  const pay=d.code==='nocredits',nav2=pay?`<button class="wbtn" id="r-inv">${t('invite_btn')}</button><button class="sbtn" style="width:100%;margin-top:10px" id="r-buy">${t('buy_pro')}</button>`:nav;
  if(d.error){box.innerHTML=`<div class="idle" style="padding:18px 0"><b>${t(d.soft?'wait_t':'no_sig')}</b>${d.error}</div>`+nav2}
  else{
    const a=d.analysis,dir=a.direction,w=dir==='WAIT',lbl=dir==='CALL'?'BUY':dir==='PUT'?'SELL':t('waitv'),ar=dir==='CALL'?'▲':dir==='PUT'?'▼':'⏸',lvl=a.strength>=70?'conf_hi':a.strength>=45?'conf_mid':'conf_lo';
    if(!re){plan=d.plan;updLim()}
    box.innerHTML=`<div class="reveal"><div class="rhead"><span>${pair}</span><span>${t('exp')}: ${w?'—':fmtExp(exp)}</span></div>
      <div class="bigdir ${dir}"><span>${ar}</span>${lbl}</div>
      <div class="rrow"><small>${t('conf')}</small><b>${t(lvl)} · ${a.strength}%</b></div><div class="bar"><div id="bf"></div></div>
      <details><summary>${t('why')}</summary><ul>${a.reasons.map(x=>`<li>${x}</li>`).join('')}</ul></details></div>`+nav+`<button class="lnk" id="r-chart">📈 ${t('open_chart')}</button>`;
    requestAnimationFrame(()=>{const b=$('bf');if(b)b.style.width=a.strength+'%'});
    if(!re){
      if(d.signal){marker={dir,price:candles[candles.length-1].c};trade={id:d.signal.id,pair,tf,dir,entry:d.signal.entry,end:d.signal.end,dur:d.signal.dur};renderTrade()}
      tg?.HapticFeedback?.notificationOccurred(w?'warning':'success');
      beep(dir==='CALL'?[660,880]:dir==='PUT'?[660,440]:[440])}
  }
  const bind=(id,f)=>{const e=$(id);if(e)e.onclick=f};bind('r-again',runAnalysis);bind('r-time',()=>wz('time'));bind('r-pair',()=>wz('pair'));bind('r-inv',inviteFriend);bind('r-buy',()=>{view('prof');openPay()});
  const rc=$('r-chart');if(rc)rc.onclick=()=>view('chart')}
setExp(exp);applyLang();binConnect();loadChart();loadMe();requestAnimationFrame(frame);
</script></body></html>
